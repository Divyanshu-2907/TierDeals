# Tells the Shopify CLI how to run this app's web process during `shopify app dev`.
# The CLI injects SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOPIFY_APP_URL, SCOPES
# and PORT into the environment before running the command below.
#
# `frontend` joins `roles` in Phase 3, when the Vite/React admin is added.
roles = ["backend"]
webhooks_path = "/api/webhooks"

[commands]
dev = "npm run dev --workspace web/backend"

# Tells the Shopify CLI how to run this app's web process during `shopify app dev`.
# The CLI runs the command below from this file's directory (web/backend), and
# injects SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOPIFY_APP_URL, SCOPES and PORT
# into its environment first.
#
# Phase 3 adds web/frontend/shopify.web.toml with `roles = ["frontend"]` for
# the Vite/React admin.
roles = ["backend"]
webhooks_path = "/api/webhooks"

[commands]
dev = "npm run dev"

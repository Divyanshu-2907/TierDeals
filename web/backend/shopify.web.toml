# Tells the Shopify CLI how to run this app's web process during `shopify app dev`.
# The CLI runs the command below from this file's directory (web/backend). It
# injects SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SCOPES, PORT and the public URL
# (as APP_URL and HOST, not SHOPIFY_APP_URL; src/config/env.ts maps it).
#
# This is a single-process app, so it takes both roles. The CLI's dev proxy
# only routes requests to a process with the `frontend` role; with `backend`
# alone, every request through the proxy fails with "Invalid path".
roles = ["frontend", "backend"]
webhooks_path = "/api/webhooks"

# Fixed instead of random so the server can be reached directly on
# http://localhost:3000 (for /health) while `shopify app dev` is running.
port = 3000

[commands]
dev = "npm run dev"

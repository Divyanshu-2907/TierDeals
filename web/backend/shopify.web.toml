# Tells the Shopify CLI how to run this app's web process during `shopify app dev`.
# The CLI runs the command below from this file's directory (web/backend). It
# injects SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SCOPES, PORT and the public URL
# (as APP_URL and HOST, not SHOPIFY_APP_URL; src/config/env.ts maps it).
#
# The CLI proxy routes requests to the frontend (web/frontend), whose Vite dev
# server forwards /api here. In production this server also serves the built
# admin UI, so there is one process.
roles = ["backend"]
webhooks_path = "/api/webhooks"

# Fixed instead of random so the server can be reached directly on
# http://localhost:3000 (for /health) while `shopify app dev` is running, and
# so the frontend's proxy target is predictable.
port = 3000

[commands]
# The CLI gives this process an open, non-TTY stdin. `tsx watch` stalls on that
# (at least on Windows) and never starts the server, so the backend's dev
# script uses Node's own --watch with tsx as a loader instead.
dev = "npm run dev"
